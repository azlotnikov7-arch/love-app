<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love You</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .heart-container {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: pulse 2s infinite ease-in-out;
        }
        .heart-text {
            font-size: 48px;
            font-weight: bold;
            color: #ff4d6d;
            text-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="heart-container">
        <div class="heart-text">Love you.</div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand(); 
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const texts = [];
        const phrases = ["i love you", "love you", "i love you", "love"];
        const maxTexts = 50;

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                if (Math.random() > 0.5) {
                    this.x = Math.random() * width;
                    this.y = Math.random() > 0.5 ? -20 : height + 20;
                } else {
                    this.x = Math.random() > 0.5 ? -50 : width + 50;
                    this.y = Math.random() * height;
                }
                
                this.text = phrases[Math.floor(Math.random() * phrases.length)];
                this.speed = 0.5 + Math.random() * 1.5;
                this.size = 10 + Math.random() * 16;
                this.opacity = 0.2 + Math.random() * 0.8;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                const dx = width / 2 - this.x;
                const dy = height / 2 - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 60) {
                    this.reset();
                } else {
                    this.x += (dx / dist) * this.speed + Math.cos(this.angle) * 0.3;
                    this.y += (dy / dist) * this.speed + Math.sin(this.angle) * 0.3;
                }

                if (dist < 250) {
                    this.opacity *= 0.97;
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 100, 100, ${this.opacity})`;
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255, 0, 0, 0.8)';
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        for (let i = 0; i < maxTexts; i++) {
            texts.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 0, 0, 0.03)';
            ctx.beginPath();
            const heartX = width / 2;
            const heartY = height / 2;
            const size = Math.min(width, height) * 0.4;
            
            ctx.moveTo(heartX, heartY + size * 0.3);
            ctx.bezierCurveTo(heartX - size, heartY - size * 0.5, heartX - size * 0.5, heartY - size, heartX, heartY - size * 0.5);
            ctx.bezierCurveTo(heartX + size * 0.5, heartY - size, heartX + size, heartY - size * 0.5, heartX, heartY + size * 0.3);
            ctx.fill();

            texts.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
